name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/iot-ui/package-lock.json

      - name: Install dependencies
        working-directory: Frontend/iot-ui
        run: npm ci

      - name: Build
        working-directory: Frontend/iot-ui
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
          VITE_FRONTEND_KEY: ${{ secrets.VITE_FRONTEND_KEY }}
          VITE_STORAGE_KEY: ${{ secrets.VITE_STORAGE_KEY }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Frontend/iot-ui/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4