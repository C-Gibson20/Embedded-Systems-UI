name: Deploy to GitHub Pages

on:
  push:
    branches: 
      - "main"
      - "marketing_site" 
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Main Branch
        uses: actions/checkout@v4

      - name: Checkout Marketing Branch
        uses: actions/checkout@v4
        with:
          ref: marketing_site
          path: marketing_site

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/iot-ui/package-lock.json

      - name: Install dependencies
        working-directory: Frontend/iot-ui
        run: npm ci

      - name: Build Main Site
        working-directory: Frontend/iot-ui
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
          VITE_FRONTEND_KEY: ${{ secrets.VITE_FRONTEND_KEY }}
          VITE_STORAGE_KEY: ${{ secrets.VITE_STORAGE_KEY }}
        run: npm run build

      - name: Build Marketing Site
        run: |
          cd marketing_site/Marketing
          npm install
          npm run build

      - name: Inject Marketing Site
        run: |
          mkdir -p Frontend/iot-ui/dist/marketing
          cp -r marketing_site/Marketing/dist/* Frontend/iot-ui/dist/marketing/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Frontend/iot-ui/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4